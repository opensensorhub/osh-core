name: Publish package to GitHub Packages
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*)?'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # fetches all history so branch heads are available for comparison

      - name: Check if tag points to the latest commit on main branch
        run: |
          # get the SHA of the tag that triggered the workflow
          TAG_SHA=$(git rev-parse HEAD)

          # get the latest SHA of the remote main branch
          MAIN_SHA=$(git rev-parse origin/master)

          echo "Tag SHA:  $TAG_SHA"
          echo "Main SHA: $MAIN_SHA"

          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Error: This tag does not point to the latest commit on the main branch."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Publish package
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
